<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio | GODNECHEZ</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Montserrat,Arial;
}

body{
background:#F8FAFC;
color:#111;
}

/* NAV */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 7%;
background:white;
box-shadow:0 2px 10px rgba(0,0,0,.05);
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-weight:800;
color:#0057FF;
}

nav a{
margin-left:15px;
text-decoration:none;
font-weight:600;
color:#111;
}

.cta{
background:#FFD60A;
padding:10px 18px;
border-radius:30px;
font-weight:700;
text-decoration:none;
color:#111;
}

/* HERO */
.hero{
padding:60px 7%;
text-align:center;
background:linear-gradient(135deg,#0057FF,#FFD60A);
color:white;
}

.hero h1{
font-size:2.5rem;
}

/* FILTER */
.filter{
padding:30px 7%;
text-align:center;
}

.filter button{
margin:5px;
padding:10px 15px;
border:none;
border-radius:20px;
cursor:pointer;
font-weight:600;
background:#0057FF;
color:white;
transition:.3s;
}

.filter button:hover{
background:#FFD60A;
color:#111;
}

/* GRID */
.grid{
padding:20px 7% 80px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:15px;
}

/* CARD */
.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.05);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.content{
padding:10px;
}

.actions{
display:flex;
justify-content:space-between;
margin-top:8px;
}

button{
border:none;
padding:6px 10px;
border-radius:20px;
cursor:pointer;
}

.like{
background:#FFD60A;
}

.share{
background:#0057FF;
color:white;
}

/* FOOTER */
footer{
background:#111827;
color:white;
padding:40px 7%;
text-align:center;
margin-top:40px;
}

</style>

</head>

<body>

<!-- NAV -->
<header>
<div class="logo">GODNECHEZ</div>

<nav>
<a href="index.html">Home</a>
<a href="portfolio.html">Portfolio</a>
<a href="contact.html">Contact</a>
</nav>

<a class="cta" href="https://wa.me/234XXXXXXXXXX?text=I%20want%20a%20design">Hire Us</a>
</header>

<!-- HERO -->
<section class="hero">
<h1>Our Creative Portfolio</h1>
<p>Explore flyers, logos, branding & social media designs</p>
</section>

<!-- FILTER -->
<section class="filter">
<button onclick="filter('all')">All</button>
<button onclick="filter('flyer')">Flyers</button>
<button onclick="filter('logo')">Logos</button>
<button onclick="filter('branding')">Branding</button>
<button onclick="filter('social')">Social</button>
</section>

<!-- GRID -->
<section class="grid" id="grid"></section>

<!-- FOOTER -->
<footer>
© 2026 GODNECHEZ CREATIVE SOLUTIONS
</footer>

<script>

/* ================= FIREBASE READY DATA ================= */
/* (Replace this later with Firestore connection) */

let projects = [
{
id:1,
title:"Luxury Logo",
category:"logo",
image:"images/logo1.jpg"
},
{
id:2,
title:"Event Flyer",
category:"flyer",
image:"images/flyer1.jpg"
},
{
id:3,
title:"Brand Identity",
category:"branding",
image:"images/brand1.jpg"
},
{
id:4,
title:"Instagram Post",
category:"social",
image:"images/post1.jpg"
}
];

const grid = document.getElementById("grid");

/* RENDER */
function render(data){
grid.innerHTML = "";

data.forEach(item=>{
grid.innerHTML += `
<div class="card">
<img src="${item.image}">
<div class="content">
<h4>${item.title}</h4>

<div class="actions">
<button class="like" onclick="like('${item.id}')">Like ❤️</button>
<button class="share" onclick="share('${item.title}')">Share</button>
</div>

</div>
</div>
`;
});
}

render(projects);

/* FILTER */
function filter(cat){
if(cat === "all") return render(projects);
render(projects.filter(p => p.category === cat));
}

/* LIKE (temporary localStorage) */
function like(id){
localStorage.setItem("like_"+id, true);
alert("Liked!");
}

/* SHARE */
function share(title){
let phone = "234XXXXXXXXXX";
window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(title+" from GODNECHEZ"));
}

</script>

</body>
</html>
