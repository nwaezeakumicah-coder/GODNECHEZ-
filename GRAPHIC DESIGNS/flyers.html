<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flyers Collection | GODNECHEZ</title>

<style>

:root{
    --blue:#0057FF;
    --yellow:#FFD60A;
    --dark:#111827;
    --light:#F8FAFC;
    --gray:#64748B;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Montserrat, Arial, sans-serif;
}

body{
    background:var(--light);
    color:var(--dark);
}

/* HEADER */
header{
    position:sticky;
    top:0;
    background:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 15px rgba(0,0,0,.05);
    z-index:1000;
}

.logo{
    font-weight:800;
    color:var(--blue);
    font-size:1.3rem;
}

nav a{
    margin-left:15px;
    text-decoration:none;
    color:var(--dark);
    font-weight:600;
}

/* HERO */
.hero{
    padding:70px 7%;
    text-align:center;
    background:linear-gradient(135deg,var(--blue),var(--yellow));
    color:white;
}

.hero h1{
    font-size:3rem;
}

.hero p{
    margin-top:10px;
}

/* SEARCH */
.search{
    padding:30px 7%;
    text-align:center;
}

.search input{
    width:100%;
    max-width:600px;
    padding:15px;
    border-radius:40px;
    border:none;
    outline:none;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
}

/* GRID */
.grid{
    padding:40px 7%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

/* CARD */
.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 20px rgba(0,0,0,.05);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.img{
    height:180px;
    background:linear-gradient(135deg,var(--blue),var(--yellow));
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.content{
    padding:12px;
}

.content h3{
    font-size:1rem;
}

.btn{
    margin-top:10px;
    display:inline-block;
    padding:10px 15px;
    background:var(--blue);
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-size:.8rem;
}

/* FOOTER BUTTON */
.float{
    position:fixed;
    bottom:20px;
    right:20px;
    background:var(--blue);
    color:white;
    padding:12px 18px;
    border-radius:30px;
    font-weight:700;
    cursor:pointer;
}

</style>
</head>

<body>

<header>
<div class="logo">GODNECHEZ FLYERS</div>

<nav>
<a href="portfolio.html">Back</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<!-- HERO -->
<section class="hero">
<h1>Flyer Designs</h1>
<p>Browse over 60 professional flyer designs</p>
</section>

<!-- SEARCH -->
<div class="search">
<input type="text" id="search" placeholder="Search flyers..." onkeyup="filterCards()">
</div>

<!-- GRID (60 CARDS) -->
<section class="grid" id="grid">

<!-- Cards will be generated by JS -->

</section>

<!-- FLOAT BUTTON -->
<div class="float" onclick="orderDesign()">
Order Design
</div>

<script>

/* CREATE 60 CARDS */
const grid = document.getElementById("grid");

for(let i=1;i<=60;i++){

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <div class="img">Flyer ${i}</div>
        <div class="content">
            <h3>Flyer Design ${i}</h3>
            <a class="btn" href="#" onclick="shareDesign(${i})">
                Order Similar
            </a>
        </div>
    `;

    grid.appendChild(card);
}

/* SEARCH FUNCTION */
function filterCards(){
    let input = document.getElementById("search").value.toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach(card=>{
        let text = card.innerText.toLowerCase();
        card.style.display = text.includes(input) ? "block" : "none";
    });
}

/* WHATSAPP ORDER */
function shareDesign(id){
    let msg = `Hello, I want a design similar to Flyer ${id} from GODNECHEZ`;
    let url = `https://wa.me/?text=${encodeURIComponent(msg)}`;
    window.open(url,"_blank");
}

/* GLOBAL ORDER BUTTON */
function orderDesign(){
    let msg = `Hello, I want a custom flyer design from GODNECHEZ`;
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,"_blank");
}

</script>

</body>
</html>
