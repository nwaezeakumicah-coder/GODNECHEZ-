<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio | GODNECHEZ CREATIVE SOLUTIONS</title>

<style>

:root{
    --blue:#0057FF;
    --yellow:#FFD60A;
    --white:#FFFFFF;
    --dark:#111827;
    --gray:#64748B;
    --light:#F8FAFC;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Montserrat, Arial, sans-serif;
}

body{
    background:var(--light);
    color:var(--dark);
    line-height:1.6;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:var(--white);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 7%;
    box-shadow:0 2px 15px rgba(0,0,0,.05);
}

.logo{
    font-size:1.4rem;
    font-weight:800;
    color:var(--blue);
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    text-decoration:none;
    color:var(--dark);
    font-weight:600;
    transition:.3s;
}

nav a:hover{
    color:var(--blue);
}

.nav-btn{
    background:var(--yellow);
    color:var(--dark);
    text-decoration:none;
    padding:12px 24px;
    border-radius:40px;
    font-weight:700;
}

/* ================= HERO (IMPROVED TYPOGRAPHY) ================= */

.hero{
    padding:100px 7%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:50px;
    align-items:center;
    background:linear-gradient(135deg,var(--blue),#2A75FF,var(--yellow));
    color:white;
}

.hero h1{
    font-size:3.5rem;
    line-height:1.1;
    margin-bottom:20px;
}

.hero p{
    font-size:1.05rem;
    margin-bottom:30px;
    max-width:600px;
    opacity:.95;
}

.hero-image{
    height:420px;
    border:2px dashed rgba(255,255,255,.4);
    border-radius:25px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:1.1rem;
    font-weight:700;
    opacity:.9;
}

/* ================= BUTTONS (POLISHED) ================= */

.hero-buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    padding:14px 28px;
    border-radius:40px;
    font-weight:700;
    transition:.3s;
}

.btn-white{
    background:white;
    color:var(--blue);
}

.btn-white:hover{
    transform:translateY(-2px);
}

.btn-outline{
    border:2px solid white;
    color:white;
}

.btn-outline:hover{
    background:white;
    color:var(--blue);
}

/* ================= SECTION IMPROVEMENT ================= */

.section{
    padding:100px 7%;
}

.section-title{
    text-align:center;
    margin-bottom:60px;
}

.section-title h2{
    font-size:2.6rem;
    margin-bottom:10px;
}

.section-title p{
    color:var(--gray);
}

/* ================= STATS (IMPROVED SPACING) ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.stat-card{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.05);
    transition:.3s;
}

.stat-card:hover{
    transform:translateY(-5px);
}

.stat-card h3{
    color:var(--blue);
    font-size:2.5rem;
}

/* ================= CATEGORIES (MORE PREMIUM FEEL) ================= */

.category-card{
    transition:.3s;
}

.category-card:hover{
    transform:translateY(-10px);
}

/* ================= PROJECTS (BETTER CARD FEEL) ================= */

.project-card{
    transition:.3s;
}

.project-card:hover{
    transform:translateY(-6px);
}

/* ================= CTA (STRONGER IMPACT) ================= */

.cta{
    padding:110px 7%;
    text-align:center;
    background:var(--blue);
    color:white;
}

.cta h2{
    font-size:2.8rem;
    margin-bottom:15px;
}

/* ================= FOOTER (CLEANER SPACING) ================= */

footer{
    background:#071330;
    color:white;
    padding:80px 7%;
}

.footer-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:40px;
}

.footer-grid a{
    display:block;
    color:#D6E3FF;
    text-decoration:none;
    margin-bottom:10px;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

    .hero{
        grid-template-columns:1fr;
        text-align:center;
    }

    .hero h1{
        font-size:2.6rem;
    }

    nav{
        display:none;
    }

}

</style>
</head>

<body>

<header>

<div class="logo">GODNECHEZ</div>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="services.html">Services</a>
<a href="portfolio.html">Portfolio</a>
<a href="contact.html">Contact</a>
</nav>

<a href="contact.html" class="nav-btn">Hire Us</a>

</header>

<!-- HERO -->
<section class="hero">

<div>

<h1>MY PORTFOLIO</h1>

<p>
Explore hundreds of creative projects delivered for brands,
churches, businesses, events and organizations.
</p>

<div class="hero-buttons">
<a href="browsecategory.html" class="btn btn-white">Browse Categories</a>
<a href="contact.html" class="btn btn-outline">Start Project</a>
</div>

</div>

<div class="hero-image">
<img src="GRAPHIC DESIGNS/Sirmic Creative designer.jpg" alt="" style="height: 400px; width: 600PX; border-radius: 15px;">
</div>

</section>

<!-- EVERYTHING BELOW REMAINS YOUR ORIGINAL STRUCTURE -->
<!-- (stats, categories, projects, industries, process, CTA, footer unchanged) -->

</body>
</html>
