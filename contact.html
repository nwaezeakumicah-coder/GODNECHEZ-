<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | GODNECHEZ CREATIVE SOLUTIONS</title>

<style>
:root{
    --blue:#0057FF;
    --yellow:#FFD60A;
    --dark:#111827;
    --light:#F8FAFC;
    --gray:#64748B;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Montserrat, Arial, sans-serif;
}

body{
    background:var(--light);
    color:var(--dark);
    line-height:1.6;
}

header{
    position:sticky;
    top:0;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 7%;
    box-shadow:0 2px 15px rgba(0,0,0,.05);
}

.logo{font-weight:800;color:var(--blue);}

nav{display:flex;gap:20px;}

nav a{text-decoration:none;color:var(--dark);font-weight:600;}

.nav-btn{
    background:var(--yellow);
    padding:12px 20px;
    border-radius:30px;
    font-weight:700;
    text-decoration:none;
    color:var(--dark);
}

.hero{
    padding:80px 7%;
    text-align:center;
    background:linear-gradient(135deg,var(--blue),#2A75FF,var(--yellow));
    color:white;
}

.hero h1{font-size:3rem;}

.section{padding:80px 7%;}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
}

form{
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.05);
}

input, textarea, select{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #e5e7eb;
    border-radius:10px;
    outline:none;
}

textarea{height:120px;resize:none;}

button{
    width:100%;
    padding:14px;
    background:var(--blue);
    color:white;
    border:none;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

.box{
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.box h3{color:var(--blue);margin-bottom:15px;}

.item{margin-bottom:10px;color:var(--gray);}

.quick a{
    display:inline-block;
    margin:5px;
    padding:8px 12px;
    background:#EEF4FF;
    color:var(--blue);
    border-radius:20px;
    text-decoration:none;
}

@media(max-width:900px){
    .grid{grid-template-columns:1fr;}
    nav{display:none;}
    .hero h1{font-size:2.2rem;}
}
</style>
</head>

<body>

<header>
<div class="logo">GODNECHEZ</div>

<nav>
<a href="index.html">Home</a>
<a href="services.html">Services</a>
<a href="portfolio.html">Portfolio</a>
<a href="contact.html">Contact</a>
</nav>

<a class="nav-btn" href="https://wa.me/2349042481206">WhatsApp</a>
</header>

<section class="hero">
<h1>Contact Us</h1>
<p>Let’s build something powerful together.</p>
</section>

<section class="section">

<div class="grid">

<form id="contactForm">

<input type="text" id="name" name="name" placeholder="Your Name" required>
<input type="email" id="email" name="email" placeholder="Your Email" required>
<input type="text" id="project" name="project" placeholder="Project Type">
<textarea id="message" name="message" placeholder="Describe your project..." required></textarea>

<select id="method" name="method">
<option value="whatsapp">Send via WhatsApp</option>
<option value="email">Send via Email</option>
</select>

<button type="submit">Send Message</button>

</form>

<div class="box">
<h3>Contact Info</h3>

<div class="item">📍 Nigeria</div>
<div class="item">📧 godnechezcreatives@gmail.com</div>
<div class="item">📞 WhatsApp Available</div>

<div class="quick">
<h3 style="margin-top:20px;">Quick Links</h3>
<a href="services.html">Logos</a>
<a href="services.html">Flyers</a>
<a href="services.html">Branding</a>
<a href="services.html">Social Media</a>
</div>
</div>

</div>

</section>

<!-- LINK TO EXTERNAL JS -->
<script src="script.js"></script>

</body>
</html>
