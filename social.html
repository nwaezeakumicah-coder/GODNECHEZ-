<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media | GODNECHEZ</title>

<style>
body{
margin:0;
font-family:Montserrat,Arial;
background:#F8FAFC;
}

header{
display:flex;
justify-content:space-between;
padding:18px 7%;
background:white;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{color:#0057FF;font-weight:800;}

.back{text-decoration:none;color:#111;font-weight:600;}

.hero{
padding:60px 7%;
background:linear-gradient(135deg,#0057FF,#FFD60A);
color:white;
}

.grid{
padding:20px 7% 80px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.img{
height:180px;
background:linear-gradient(135deg,#0057FF,#FFD60A);
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:700;
}

.content{padding:10px;}

.actions{
display:flex;
justify-content:space-between;
margin-top:8px;
}

button{
border:none;
padding:6px 10px;
border-radius:20px;
cursor:pointer;
}

.like{background:#FFD60A;}
.share{background:#0057FF;color:white;}
</style>
</head>

<body>

<header>
<div class="logo">SOCIAL MEDIA</div>
<a class="back" href="portfolio.html">← Back</a>
</header>

<section class="hero">
<h1>Social Media Designs</h1>
</section>

<section class="grid" id="grid"></section>

<script>
let data=[];
for(let i=1;i<=10;i++){
data.push({id:i,title:"Post Design "+i});
}

let grid=document.getElementById("grid");

data.forEach(item=>{
let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<div class="img">POST ${item.id}</div>
<div class="content">
<h4>${item.title}</h4>
<div class="actions">
<button class="like">Like</button>
<button class="share" onclick="share('${item.title}')">Share</button>
</div>
</div>
`;

grid.appendChild(div);
});

function share(title){
window.open("https://wa.me/?text="+encodeURIComponent(title+" from GODNECHEZ"));
}
</script>

</body>
</html>
